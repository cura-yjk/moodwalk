name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Style (RuboCop)
        run: bin/rubocop --parallel

      - name: Security (Brakeman)
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Gem vulnerability audit
        run: bin/bundler-audit --update

      - name: Importmap vulnerability audit
        run: bin/importmap audit

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostGIS, not plain postgres -- the app uses geography columns and the
        # activerecord-postgis-adapter, so a stock postgres image won't boot it.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgis://postgres:postgres@localhost:5432/moodwalk_test

    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL client libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      # External HTTP is stubbed with webmock, so no API keys are needed here.
      - name: Run tests
        run: bin/rails test

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  seeds:
    name: Seeds smoke test
    runs-on: ubuntu-latest
    # db/seeds.rb calls the live Mapbox API, so this can only run where the
    # token secret is available (not on forked-PR builds). bin/ci runs the same
    # step locally; skipping it here keeps CI green for outside contributors
    # rather than failing on a missing secret.
    if: ${{ github.event_name == 'push' }}

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgis://postgres:postgres@localhost:5432/moodwalk_test
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL client libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Replant seeds
        if: ${{ env.MAPBOX_ACCESS_TOKEN != '' }}
        run: bin/rails db:seed:replant
